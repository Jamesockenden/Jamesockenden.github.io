---
layout: base
---

<header class="header-section">
  <div class="intro-header">
    <div class="container">
      <div class="row">
        <div class="content-column">
          <div class="post-heading">
            <h1>{{ page.title }}</h1>
            <span class="post-meta">Posted on {{ page.date | date: "%B %-d, %Y" }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container content-section">
  <div class="row">
    <div class="content-column">
      <div class="blog-post">
        {{ content }}
      </div>
    </div>
  </div>
</main>
